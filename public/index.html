<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#2c2b22" />
  <title>Fin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell" id="app-shell">
    <aside class="nav-rail" aria-label="Fin navigation">
      <div class="brand">
        <div class="brand-title">Fin<span>❧</span></div>
        <div class="brand-sub">your friendly<br>finance familiar ♡</div>
      </div>
      <nav class="nav-list">
        <button class="nav-item active" data-view="chat"><span>◌</span>Chat</button>
        <button class="nav-item" data-view="spending"><span>▥</span>Spending</button>
        <button class="nav-item" data-view="bills"><span>▣</span>Bills</button>
        <button class="nav-item" data-view="savings"><span>❧</span>Savings</button>
        <button class="nav-item" data-view="income"><span>◎</span>Income</button>
        <button class="nav-item" data-view="planner"><span>▤</span>Planner</button>
      </nav>
      <div class="nav-note">Small<br>steps<br>brighter<br>days ♡</div>
    </aside>

    <section class="conversation-column">
      <section class="hero-scene" aria-label="Fin's magical study">
        <img class="hero-base" src="/hero-base.png" alt="" aria-hidden="true" />

        <div class="fin-wrap" id="fin-wrap" data-state="idle" aria-hidden="true">
          <img class="fin-art" src="/fin.png" alt="" />
          <span class="eye-lid eye-left"></span>
          <span class="eye-lid eye-right"></span>
          <span class="wand-glow"></span>
          <span class="spark spark-a"></span>
          <span class="spark spark-b"></span>
          <span class="spark spark-c"></span>
        </div>

        <div class="book-wrap" id="book-wrap" aria-hidden="true">
          <img class="book-art" src="/book.png" alt="" />
          <span class="page page-one"></span>
          <span class="page page-two"></span>
          <span class="book-glow"></span>
        </div>

        <div class="hero-speech" id="hero-speech">
          <strong>Hi there! I’m Fin.</strong>
          <span>Tell me what’s on your mind, and we’ll make sense of it together. ♡</span>
        </div>
      </section>

      <section class="chat-card">
        <div class="chat-toolbar">
          <div class="chat-heading"><span class="mini-fin">✦</span> Chat with Fin</div>
          <button id="clear-chat" class="ghost-button" type="button">+ New conversation</button>
        </div>

        <div id="chat-messages" class="messages" aria-live="polite"></div>
        <div id="typing-indicator" class="typing-indicator">Fin is checking your planner…</div>

        <div class="quick-actions" id="chips">
          <button class="chip" data-q="I bought something">I bought something</button>
          <button class="chip" data-q="I got paid">I got paid</button>
          <button class="chip" data-q="I'm saving for something">I’m saving for…</button>
          <button class="chip" data-q="What are my bills?">What are my bills?</button>
          <button class="chip" data-q="Show my progress">Show my progress</button>
        </div>

        <div class="composer">
          <textarea id="user-input" rows="1" placeholder="Tell me anything… a purchase, income, goal, or question…"></textarea>
          <button id="send-button" type="button" aria-label="Send message">➤</button>
        </div>
        <div class="footer-note">Small steps. Brighter days. ♡</div>
      </section>
    </section>

    <aside class="insight-panel" id="insight-panel" aria-label="Fin visualization" aria-hidden="true">
      <button class="close-insight" id="close-insight" aria-label="Close visualization">×</button>
      <div id="visualization-root"></div>
    </aside>
  </main>

  <script src="visualizations.js"></script>
  <script src="chat.js"></script>
</body>
</html>
