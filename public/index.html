<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1a241e" />
  <title>Fin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app-shell" id="app-shell">
    <section class="workspace">
      <div class="ambient-room" aria-hidden="true">
        <div class="window"><span class="moon"></span><i></i><i></i><i></i></div>
        <div class="shelf shelf-a"></div><div class="shelf shelf-b"></div>
        <div class="vine vine-a"></div><div class="vine vine-b"></div>
        <div class="lantern"></div><div class="desk"></div>
        <span class="spark sp1"></span><span class="spark sp2"></span><span class="spark sp3"></span>
      </div>

      <section class="fin-zone" aria-label="Fin">
        <div class="brand-lockup"><span class="brand">Fin</span><small>your friendly finance familiar ♡</small></div>
        <div class="fin-reaction" id="fin-reaction" aria-live="polite">
          <strong>Hi there! I’m Fin.</strong>
          <span>What’s on your mind?</span>
        </div>
        <div class="fin-stage" id="fin-stage" data-state="idle" aria-hidden="true">
          <img class="fin-art" src="/fin.png" alt="" />
          <span class="blink blink-left"></span><span class="blink blink-right"></span>
          <span class="wand-glow"></span>
        </div>
        <div class="book-stage" id="book-stage" aria-hidden="true">
          <img src="/book.png" alt="" class="book-art" />
          <span class="page-flip pf1"></span><span class="page-flip pf2"></span><span class="page-flip pf3"></span>
        </div>
        <div class="status-whisper" id="status-whisper">Ready when you are ✦</div>
      </section>

      <section class="conversation-zone">
        <header class="conversation-header">
          <div>
            <span class="eyebrow">Conversation</span>
            <h1>Talk to Fin</h1>
          </div>
          <button id="clear-chat" class="quiet-button" type="button">New conversation</button>
        </header>

        <div class="messages" id="chat-messages" aria-live="polite"></div>
        <div class="typing-indicator" id="typing-indicator">Fin is checking your planner…</div>

        <div class="quick-actions" id="chips">
          <button class="chip" data-q="How is my spending this month?">How’s my spending?</button>
          <button class="chip" data-q="What bills are coming up?">What bills are coming up?</button>
          <button class="chip" data-q="How are my savings goals going?">How are my goals?</button>
          <button class="chip" data-q="Show me my Budget Plan and help me decide what I can spend.">Help me budget</button>
        </div>

        <div class="composer-wrap">
          <textarea id="user-input" rows="1" placeholder="Ask Fin anything…"></textarea>
          <button id="send-button" type="button" aria-label="Send message">➤</button>
        </div>
        <p class="composer-note">Purchases, income, bills, savings goals, or anything you want to understand.</p>
      </section>
    </section>

    <aside class="artifact-panel" id="insight-panel" aria-hidden="true">
      <header class="artifact-header">
        <div><span class="artifact-eyebrow">Fin’s visual</span><strong id="artifact-title">Breakdown</strong></div>
        <button id="close-insight" class="artifact-close" type="button" aria-label="Close visualization">×</button>
      </header>
      <div id="visualization-root" class="visualization-root"></div>
    </aside>
  </main>

  <script src="/visualizations.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
