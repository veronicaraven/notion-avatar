<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#473522" />
  <title>Fin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet" />

  <style>
    :root {
      --wood: #4c3725;
      --wood-deep: #2c2118;
      --cream: #fffaf0;
      --paper: #f6efe2;
      --paper-2: #eee5d3;
      --sage: #899b69;
      --sage-dark: #66774f;
      --moss: #526042;
      --ink: #40372f;
      --muted: #7d7469;
      --line: #d8cdbc;
      --glow: rgba(255, 222, 151, 0.28);
      --font-body: "Nunito", system-ui, sans-serif;
      --font-hand: "Patrick Hand", cursive;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 0%, rgba(163, 133, 89, .15), transparent 28%),
        linear-gradient(180deg, #2c231b, #1d1814);
      display: flex;
      justify-content: center;
      padding: 18px;
    }

    .app {
      width: min(980px, 100%);
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .45);
      background: var(--wood-deep);
      border: 1px solid rgba(255,255,255,.06);
    }

    .hero {
      position: relative;
      min-height: 560px;
      background:
        linear-gradient(to bottom, rgba(20, 16, 12, .05), rgba(20,16,12,.18)),
        url("fin-wizard.png") center 34% / cover no-repeat;
      isolation: isolate;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, transparent 55%, rgba(36, 27, 20, .42) 82%, rgba(36,27,20,.8));
      z-index: -1;
      pointer-events: none;
    }

    .brand {
      position: absolute;
      left: 32px;
      top: 24px;
      color: #fff7e8;
      text-shadow: 0 2px 16px rgba(0,0,0,.55);
    }

    .brand h1 {
      font-family: var(--font-hand);
      font-size: clamp(60px, 8vw, 96px);
      font-weight: 400;
      line-height: .82;
      letter-spacing: -.03em;
    }

    .brand p {
      margin-top: 12px;
      max-width: 220px;
      font-family: var(--font-hand);
      font-size: 24px;
      line-height: 1.05;
    }

    .speech {
      position: absolute;
      top: 132px;
      right: 7%;
      width: min(390px, 43%);
      background: rgba(255, 250, 240, .96);
      border: 1px solid rgba(109, 83, 52, .16);
      border-radius: 32px 32px 32px 12px;
      padding: 22px 26px;
      font-family: var(--font-hand);
      font-size: 24px;
      line-height: 1.15;
      box-shadow: 0 18px 40px rgba(0,0,0,.18);
    }

    .speech::after {
      content: "";
      position: absolute;
      left: 48px;
      bottom: -16px;
      width: 30px;
      height: 30px;
      background: inherit;
      transform: rotate(45deg);
      border-right: 1px solid rgba(109,83,52,.12);
      border-bottom: 1px solid rgba(109,83,52,.12);
    }

    .chat-shell {
      margin-top: -68px;
      position: relative;
      z-index: 5;
      background: rgba(255,250,240,.985);
      border-radius: 30px 30px 0 0;
      padding: 22px 24px 26px;
      box-shadow: 0 -18px 40px rgba(0,0,0,.18);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .toolbar-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-hand);
      font-size: 22px;
      color: #5b5146;
    }

    .leaf-dot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #dce4cc;
      color: var(--sage-dark);
      font-size: 19px;
    }

    #clear-chat {
      border: 1px solid #c8c1ad;
      background: #eff2e5;
      color: #526044;
      padding: 8px 14px;
      border-radius: 999px;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    #clear-chat:hover { background: #e5ead7; }

    .messages {
      min-height: 160px;
      max-height: 360px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 4px 2px 10px;
      scrollbar-color: #b7b09f transparent;
    }

    .message {
      max-width: 82%;
      padding: 11px 14px;
      font-size: 14.5px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message p { white-space: pre-line; }

    .assistant-message {
      align-self: flex-start;
      background: var(--paper);
      border: 1px solid #e2d8c7;
      border-radius: 19px 19px 19px 7px;
    }

    .user-message {
      align-self: flex-end;
      background: #dce4cc;
      color: #34402f;
      font-weight: 700;
      border-radius: 19px 19px 7px 19px;
    }

    .typing-indicator {
      display: none;
      color: var(--muted);
      font-size: 12.5px;
      margin: 4px 0 2px;
      padding-left: 4px;
    }

    .typing-indicator.visible { display: block; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
      margin-bottom: 14px;
    }

    .chips[hidden] { display: none; }

    .chip {
      border: 1px solid #d5c9b6;
      color: #5c544b;
      background: #fffaf1;
      border-radius: 999px;
      padding: 8px 13px;
      font: inherit;
      font-size: 12.5px;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease;
    }

    .chip:hover {
      background: #f2f0e4;
      transform: translateY(-1px);
    }

    .message-input {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #fffdf9;
      border: 1px solid #d9cebc;
      border-radius: 22px;
      padding: 7px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }

    #user-input {
      flex: 1;
      min-height: 46px;
      max-height: 120px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      padding: 12px 10px;
    }

    #user-input::placeholder { color: #aaa093; }

    #send-button {
      flex: 0 0 auto;
      width: 50px;
      height: 50px;
      border: 0;
      border-radius: 50%;
      background: var(--sage);
      color: white;
      font: inherit;
      font-size: 0;
      cursor: pointer;
      position: relative;
      box-shadow: 0 3px 8px rgba(80, 95, 62, .25);
    }

    #send-button::before {
      content: "➤";
      font-size: 22px;
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      transform: translateX(1px) rotate(-8deg);
    }

    #send-button:hover { background: var(--sage-dark); }

    #send-button:disabled,
    #user-input:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .footer-note {
      text-align: center;
      padding: 15px 20px 20px;
      background: rgba(255,250,240,.985);
      font-family: var(--font-hand);
      font-size: 16px;
      color: #8a8278;
    }

    /* Keep the Fin state hook working even though the hero is now an illustration. */
    #fin {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }

    .hero[data-fin-state="thinking"]::before,
    .hero[data-fin-state="talking"]::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 67% 47%, var(--glow), transparent 15%);
      animation: shimmer 1.4s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%,100% { opacity: .35; }
      50% { opacity: .9; }
    }

    @media (max-width: 720px) {
      body { padding: 8px; }

      .app { border-radius: 22px; }

      .hero {
        min-height: 500px;
        background-position: 50% 24%;
      }

      .brand {
        left: 20px;
        top: 18px;
      }

      .brand h1 { font-size: 58px; }

      .brand p {
        max-width: 160px;
        font-size: 20px;
      }

      .speech {
        top: 122px;
        right: 4%;
        width: 50%;
        font-size: 18px;
        padding: 16px 18px;
      }

      .chat-shell {
        margin-top: -48px;
        padding: 16px 14px 20px;
      }

      .message { max-width: 92%; }

      .toolbar-title { font-size: 18px; }

      #clear-chat { font-size: 11px; }
    }

    @media (max-width: 480px) {
      .hero {
        min-height: 430px;
        background-position: 49% 18%;
      }

      .brand p { display: none; }

      .speech {
        top: 92px;
        right: 3%;
        width: 58%;
        font-size: 15px;
      }

      .chat-shell { margin-top: -34px; }

      .chips { gap: 6px; }

      .chip {
        font-size: 11.5px;
        padding: 7px 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
      .hero[data-fin-state]::before { animation: none !important; }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="hero" id="hero">
      <div class="brand">
        <h1>Fin</h1>
        <p>your friendly finance familiar ♡</p>
      </div>

      <div class="speech">
        Hi there! I'm Fin. Tell me what you bought, earned, or are planning for — I'll help you keep track and make sense of it.
      </div>

      <div id="fin" data-state="idle" aria-hidden="true"></div>
    </section>

    <section class="chat-shell">
      <div class="toolbar">
        <div class="toolbar-title">
          <span class="leaf-dot">❧</span>
          <span>Fin's notebook</span>
        </div>
        <button id="clear-chat" type="button">+ New conversation</button>
      </div>

      <div id="chat-messages" class="messages" aria-live="polite"></div>

      <div class="typing-indicator" id="typing-indicator">
        Fin is looking through your plan...
      </div>

      <div class="chips" id="chips">
        <button class="chip" type="button" data-q="I bought a coffee for $5">❧ I bought a coffee for $5</button>
        <button class="chip" type="button" data-q="I got paid $1,200">❧ I got paid $1,200</button>
        <button class="chip" type="button" data-q="I'm saving for a trip">❧ I'm saving for a trip</button>
        <button class="chip" type="button" data-q="How's my spending this month?">❧ How's my spending?</button>
      </div>

      <div class="message-input">
        <textarea
          id="user-input"
          rows="1"
          autofocus
          placeholder="Tell me about a purchase, income, or goal..."
        ></textarea>
        <button id="send-button" type="button" aria-label="Send message">Ask</button>
      </div>
    </section>

    <div class="footer-note">
      Small steps. Brighter days. ♡
    </div>
  </main>

  <script>
    // Mirror Fin's data-state onto the hero so the illustration can glow while
    // the existing chat.js drives "idle", "thinking", and "talking".
    const finStateEl = document.getElementById("fin");
    const heroEl = document.getElementById("hero");

    if (finStateEl && heroEl) {
      const syncState = () => {
        heroEl.dataset.finState = finStateEl.dataset.state || "idle";
      };

      new MutationObserver(syncState).observe(finStateEl, {
        attributes: true,
        attributeFilter: ["data-state"]
      });

      syncState();
    }
  </script>

  <script src="chat.js"></script>
</body>
</html>
