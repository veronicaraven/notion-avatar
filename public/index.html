<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="theme-color" content="#29372f" />
	<title>Fin</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="styles.css" />
</head>
<body>
	<div class="ambient-bg" aria-hidden="true"></div>

	<main class="app" id="app">
		<section class="conversation-pane">
			<header class="topbar">
				<div class="brand">
					<div class="brand-name">Fin</div>
					<div class="brand-sub">your friendly finance familiar ♡</div>
				</div>
				<button id="clear-chat" class="new-chat" type="button">＋ New conversation</button>
			</header>

			<section class="fin-scene" id="fin-scene" aria-label="Fin, your wizard-like financial familiar">
				<div class="fin-art-wrap" id="fin" data-state="idle">
					<img src="fin-stage.png" alt="Fin wearing round glasses and pointing a wand toward a magical book" class="fin-art" />
					<span class="blink-lid" aria-hidden="true"></span>
					<span class="book-page p1" aria-hidden="true"></span>
					<span class="book-page p2" aria-hidden="true"></span>
					<span class="magic-dot d1" aria-hidden="true"></span>
					<span class="magic-dot d2" aria-hidden="true"></span>
					<span class="magic-dot d3" aria-hidden="true"></span>
				</div>
			</section>

			<section class="chat-card">
				<div id="chat-messages" class="messages" aria-live="polite"></div>
				<div id="typing-indicator" class="typing-indicator">Fin is checking the planner...</div>

				<div id="chips" class="chips">
					<button class="chip" type="button" data-q="How's my spending this month?">How's my spending?</button>
					<button class="chip" type="button" data-q="What bills are coming up?">What are my bills?</button>
					<button class="chip" type="button" data-q="Show me my savings progress.">Show my savings</button>
					<button class="chip" type="button" data-q="How much room do I have this week?">This week's room</button>
				</div>

				<div class="composer">
					<textarea id="user-input" rows="1" autofocus placeholder="Tell Fin anything... a purchase, income, goal, or question."></textarea>
					<button id="send-button" type="button" aria-label="Send message">➤</button>
				</div>
			</section>
		</section>

		<aside id="insight-panel" class="insight-panel" aria-hidden="true">
			<div class="insight-header">
				<div>
					<div class="eyebrow">Fin's chalkboard</div>
					<h2 id="insight-title">Your breakdown</h2>
					<p id="insight-subtitle"></p>
				</div>
				<button id="close-insight" class="close-insight" type="button" aria-label="Close visualization">×</button>
			</div>
			<div id="insight-content" class="insight-content"></div>
			<div class="chalk-note">Fin only draws this from the current Notion snapshot. ✦</div>
		</aside>
	</main>

	<script src="visualizations.js"></script>
	<script src="chat.js"></script>
</body>
</html>
